[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grader-hacking"
version = "0.1.0"
description = "Grader-hacking eval (inspectable grader with a known weakness, location disclosed) + a steered-vLLM inspect provider"
requires-python = ">=3.10"

dependencies = [
    # Pinned: steered_provider subclasses inspect_ai's OpenAICompatibleAPI,
    # a private module with no stability guarantee across releases.
    # 0.3.276 is the first release that treats gpt-6-* as a reasoning family:
    # 0.3.259 silently sent NO `reasoning` param (no effort) for gpt-6-sol /
    # gpt-6-astra. steered_provider was re-checked against it.
    "inspect_ai==0.3.276",
    # inspect_ai 0.3.276's Anthropic provider requires anthropic>=1.0 (this
    # repo no longer has an LLM judge, which was the reason for the old <1 pin).
    "anthropic>=1.0.0,<2",
    # inspect_ai's OpenAI providers import openai 3.x modules.
    "openai>=3.1.0",
    "pydantic>=2.13.0",
    # steering_vectors reads the .npy arrays in a vector directory.
    "numpy>=1.26",
]

# inspect resolves the --model string before it imports the task file, so the
# provider has to be discoverable through the entry point rather than an import.
[project.entry-points.inspect_ai]
steered = "steered_provider"

[tool.setuptools.packages.find]
where = ["."]
include = ["gh_eval*", "steered_provider*", "steering_vectors*"]

[tool.setuptools.package-data]
gh_eval = ["env/*"]
